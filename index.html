<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Fitter | Find Your Meta</title>
    <style>
        /* Темный, стильный киберспортивный дизайн */
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent: #ff4655; /* Классический красный акцент */
            --text-main: #ece8e1;
            --text-muted: #8b92a5;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px;}

        .lang-switch button {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 5px;
            transition: 0.2s;
        }

        .lang-switch button.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .question-block {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
            font-size: 16px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { background: #ff2a3a; }

        /* Стили для карточек результатов */
        .result-card {
            background: var(--card-bg);
            border-left: 4px solid var(--accent);
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
        }

        .result-card h3 { margin: 0 0 10px 0; }
        .specs { font-size: 14px; color: var(--text-muted); }
        .match-score { color: #4ade80; font-weight: bold; float: right;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 data-i18n="title">Mouse Fitter</h1>
        <div class="lang-switch">
            <button onclick="setLang('en')" id="btn-en" class="active">EN</button>
            <button onclick="setLang('ru')" id="btn-ru">RU</button>
        </div>
    </div>

    <div class="question-block">
        <label data-i18n="q1_label">Hand Length (cm)</label>
        <select id="handLength">
            <option value="size_small" data-i18n="q1_opt1">Under 17 cm (Small)</option>
            <option value="size_medium" data-i18n="q1_opt2">17 - 19 cm (Medium)</option>
            <option value="size_large" data-i18n="q1_opt3">Over 19 cm (Large)</option>
        </select>
    </div>

    <div class="question-block">
        <label data-i18n="q2_label">Grip Style</label>
        <select id="gripType">
            <option value="grip_palm" data-i18n="q2_opt1">Palm Grip</option>
            <option value="grip_claw" data-i18n="q2_opt2">Claw Grip</option>
            <option value="grip_fingertip" data-i18n="q2_opt3">Fingertip Grip</option>
        </select>
    </div>

    <div class="question-block">
        <label data-i18n="q3_label">Hand Tension In-Game</label>
        <select id="handTension">
            <option value="tension_high" data-i18n="q3_opt1">High (Tense/Firm grip)</option>
            <option value="tension_low" data-i18n="q3_opt2">Low (Relaxed/Light control)</option>
        </select>
    </div>

    <button class="btn-submit" onclick="findMeta()" data-i18n="btn_submit">Find My Meta</button>

    <div id="resultsArea" style="display: none; margin-top: 30px;">
        <h2 data-i18n="results_title">Your Top Matches:</h2>
        <div id="mouseList"></div>
    </div>
</div>

<script>
    // 1. СЛОВАРЬ ДЛЯ ПЕРЕВОДОВ
    const dict = {
        en: {
            title: "Mouse Fitter",
            q1_label: "Hand Length (from wrist to middle finger)",
            q1_opt1: "Under 17 cm (Small)",
            q1_opt2: "17 - 19.5 cm (Medium)",
            q1_opt3: "Over 19.5 cm (Large)",
            q2_label: "Primary Grip Style",
            q2_opt1: "Palm Grip",
            q2_opt2: "Claw Grip",
            q2_opt3: "Fingertip Grip",
            q3_label: "Hand Tension In-Game",
            q3_opt1: "High (Tense / Deathgrip)",
            q3_opt2: "Low (Relaxed / Light control)",
            btn_submit: "Find My Meta",
            results_title: "Your Top Matches:",
            weight: "Weight",
            dimensions: "Dimensions"
        },
        ru: {
            title: "Подбор Мыши",
            q1_label: "Длина ладони (от запястья до среднего пальца)",
            q1_opt1: "До 17 см (Маленькая)",
            q1_opt2: "17 - 19.5 см (Средняя)",
            q1_opt3: "Более 19.5 см (Большая)",
            q2_label: "Основной тип хвата",
            q2_opt1: "Ладонный (Palm)",
            q2_opt2: "Когтевой (Claw)",
            q2_opt3: "Пальцевой (Fingertip)",
            q3_label: "Напряжение кисти в игре",
            q3_opt1: "Высокое (Сильно сжимаю мышь)",
            q3_opt2: "Низкое (Расслабленная кисть)",
            btn_submit: "Подобрать мышь",
            results_title: "Твои идеальные варианты:",
            weight: "Вес",
            dimensions: "Размеры"
        }
    };

    let currentLang = 'en';

    // Функция переключения языка
    function setLang(lang) {
        currentLang = lang;
        
        // Меняем активную кнопку
        document.getElementById('btn-en').classList.remove('active');
        document.getElementById('btn-ru').classList.remove('active');
        document.getElementById(`btn-${lang}`).classList.add('active');

        // Ищем все элементы с атрибутом data-i18n и меняем им текст
        document.querySelectorAll('[data-i18n]').forEach(elem => {
            const key = elem.getAttribute('data-i18n');
            if (dict[lang][key]) {
                elem.innerText = dict[lang][key];
            }
        });

        // Если результаты уже открыты, обновляем и их
        if(document.getElementById('resultsArea').style.display === 'block') {
            findMeta();
        }
    }

    // 2. БАЗА ДАННЫХ МЫШЕК (Твоя MVP база на 20 штук)
    const mouseDatabase = [
        { brand: "Logitech", model: "G Pro X Superlight 2", specs: { length: 125, width: 63.5, height: 40, weight: 60 }, tags: ["size_medium", "size_large", "grip_palm", "grip_claw", "tension_low"] },
        { brand: "Razer", model: "DeathAdder V3 Pro", specs: { length: 128, width: 68, height: 44, weight: 63 }, tags: ["size_large", "grip_palm", "tension_high"] },
        { brand: "Razer", model: "Viper V3 Pro", specs: { length: 127.1, width: 63.9, height: 39.9, weight: 54 }, tags: ["size_medium", "size_large", "grip_claw", "grip_fingertip", "tension_low"] },
        { brand: "Endgame Gear", model: "OP1 8k", specs: { length: 118.2, width: 60.5, height: 37.2, weight: 50.5 }, tags: ["size_small", "size_medium", "grip_claw", "tension_high"] },
        { brand: "Zowie", model: "U2", specs: { length: 124, width: 65, height: 38, weight: 60 }, tags: ["size_medium", "grip_claw", "tension_high"] },
        { brand: "Lamzu", model: "Atlantis OG V2", specs: { length: 123, width: 66, height: 38, weight: 55 }, tags: ["size_medium", "grip_claw", "tension_low"] },
        { brand: "Ninjutso", model: "Sora V2", specs: { length: 119.2, width: 59, height: 37.3, weight: 39 }, tags: ["size_small", "size_medium", "grip_claw", "grip_fingertip", "tension_low"] },
        { brand: "WLMOUSE", model: "Beast X", specs: { length: 122, width: 62, height: 37, weight: 39 }, tags: ["size_medium", "grip_fingertip", "grip_claw", "tension_low"] },
        { brand: "Vaxee", model: "Outset AX", specs: { length: 117, width: 65, height: 43, weight: 73 }, tags: ["size_medium", "grip_palm", "grip_claw", "tension_high"] },
        { brand: "G-Wolves", model: "HTS Plus Pro", specs: { length: 117, width: 61, height: 40, weight: 27.7 }, tags: ["size_small", "size_medium", "grip_claw", "grip_fingertip", "tension_low"] }
        // Сюда можно дописать остальные мышки из базы
    ];

    // 3. ЛОГИКА ПОДБОРА
    function findMeta() {
        // Собираем теги юзера из формы
        const userTags = [
            document.getElementById('handLength').value,
            document.getElementById('gripType').value,
            document.getElementById('handTension').value
        ];

        // Считаем баллы совпадения
        let scoredMice = mouseDatabase.map(mouse => {
            let score = 0;
            mouse.tags.forEach(tag => {
                if (userTags.includes(tag)) score++;
            });
            return { ...mouse, matchScore: score };
        });

        // Сортируем: у кого больше баллов, тот выше
        scoredMice.sort((a, b) => b.matchScore - a.matchScore);

        // Берем Топ-3
        const topMatches = scoredMice.slice(0, 3);

        // Отрисовываем результаты
        const listHTML = document.getElementById('mouseList');
        listHTML.innerHTML = ""; // Очищаем старые результаты

        topMatches.forEach(mouse => {
            // Высчитываем процент совпадения (максимум 3 тега = 100%)
            const percent = Math.round((mouse.matchScore / 3) * 100);
            
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <span class="match-score">${percent}% Match</span>
                <h3>${mouse.brand} ${mouse.model}</h3>
                <div class="specs">
                    ${dict[currentLang].weight}: ${mouse.specs.weight}g <br>
                    ${dict[currentLang].dimensions}: ${mouse.specs.length} x ${mouse.specs.width} x ${mouse.specs.height} mm
                </div>
            `;
            listHTML.appendChild(card);
        });

        // Показываем блок с результатами
        document.getElementById('resultsArea').style.display = 'block';
    }

    // Инициализация (устанавливаем дефолтный английский при загрузке)
    setLang('en');
</script>

</body>
</html>
